# Ejecuta las pruebas automáticas cada vez que se suben cambios o se abre una petición de
# cambios (pull request). Si alguna prueba falla, GitHub lo marca en rojo.
name: Pruebas automáticas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar las pruebas
        run: python -m unittest -v
